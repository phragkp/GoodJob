<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบหลังบ้าน - Road Accident Analysis System</title>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1E293B;
            --secondary: #0284C7;
            --accent: #E11D48;
            --bg-light: #F8FAFC;
            --text-dark: #334155;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F172A 0%, var(--primary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background-color: var(--white);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2.5rem 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .logo-text span {
            color: var(--accent);
        }

        .login-title {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .login-subtitle {
            color: #64748B;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .login-btn {
            width: 100%;
            background-color: var(--secondary);
            color: var(--white);
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background-color: #0369A1;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #64748B;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="logo-text">ROAD ACCIDENT <span>ANALYSIS</span></div>
            <h1 class="login-title">เข้าสู่ระบบหลังบ้าน</h1>
            <p class="login-subtitle">ระบบจัดการข้อมูลและโมเดลวิเคราะห์อุบัติเหตุ</p>
        </div>

        <form action="admin-dashboard.html" method="GET">
            <div class="form-group">
                <label for="username" class="form-label">ชื่อผู้ใช้งาน / อีเมล</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">รหัสผ่าน</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
        </form>

        <a href="index.html" class="back-link">← กลับไปหน้าหลักเว็บไซต์</a>
    </div>

</body>
</html>
